name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set app version from tag
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Setting version to: $VERSION"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $VERSION
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
          Write-Host "Version updated to $VERSION"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Perfect Text ${{ github.ref_name }}'
          releaseBody: 'Nova razlicica Perfect Text. Prenesite datoteko Perfect.Text_x.x.x_x64-setup.exe spodaj.'
          releaseDraft: false
          prerelease: false

      - name: Generate and commit latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG.TrimStart('v')
          $REPO = "andrej99ai/tipkam-si-desktop"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github.v3+json"
          }

          # Pocakaj da GitHub indeksira assete
          Start-Sleep -Seconds 15

          # Pridobi release po tagu
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$REPO/releases/tags/$TAG" -Headers $headers
          Write-Host "Asseti v releaseu:"
          $release.assets | ForEach-Object { Write-Host "  $($_.name)" }

          # Poišci NSIS .sig (ne MSI)
          $sigAsset = $release.assets | Where-Object {
            $_.name -like "*.sig" -and $_.name -notlike "*msi*" -and $_.name -notlike "*MSI*"
          } | Select-Object -First 1
          if (-not $sigAsset) {
            $sigAsset = $release.assets | Where-Object { $_.name -like "*.sig" } | Select-Object -First 1
          }
          Write-Host "Sig asset: $($sigAsset.name)"

          # Prenesi signaturo
          $dlHeaders = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/octet-stream" }
          $signature = (Invoke-RestMethod -Uri $sigAsset.url -Headers $dlHeaders)
          if ($signature -isnot [string]) { $signature = [System.Text.Encoding]::UTF8.GetString($signature) }
          $signature = $signature.Trim()
          Write-Host "Signatura pridobljena (prvih 40 znakov): $($signature.Substring(0, [Math]::Min(40,$signature.Length)))"

          # Poišci .exe asset
          $exeAsset = $release.assets | Where-Object { $_.name -like "*setup.exe" } | Select-Object -First 1
          Write-Host "Exe asset: $($exeAsset.name)"

          $latestJson = [ordered]@{
            version  = $VERSION
            notes    = "Nova razlicica Perfect Text."
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url       = $exeAsset.browser_download_url
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5

          Write-Host "Generirani latest.json:"
          Write-Host $latestJson

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          Set-Content -Path latest.json -Value $latestJson -Encoding UTF8
          git add latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update latest.json for $TAG"
            git push origin main
            Write-Host "latest.json uspesno posodobljen!"
          } else {
            Write-Host "Ni sprememb v latest.json"
          }

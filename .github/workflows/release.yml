name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set app version from tag
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Setting version to: $VERSION"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $VERSION
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
          Write-Host "tauri.conf.json version updated to $VERSION"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Perfect Text ${{ github.ref_name }}'
          releaseBody: 'Nova razlicica Perfect Text. Prenesite datoteko Perfect.Text_x.x.x_x64-setup.exe spodaj.'
          releaseDraft: false
          prerelease: false

      - name: Generate and commit latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG.TrimStart('v')

          # Poisci NSIS .sig datoteko
          $sigFile = Get-ChildItem -Recurse -Path "src-tauri/target/release/bundle/nsis" -Filter "*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sigFile) {
            $sigFile = Get-ChildItem -Recurse -Path "src-tauri/target/release/bundle" -Filter "*.sig" | Select-Object -First 1
          }
          Write-Host "Sig datoteka: $($sigFile.FullName)"
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()

          # Poisci exe ime
          $exeFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          $exeName = $exeFile.Name
          Write-Host "Exe: $exeName"

          $latestJson = [ordered]@{
            version = $VERSION
            notes = "Nova razlicica Perfect Text."
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/andrej99ai/tipkam-si-desktop/releases/download/$TAG/$exeName"
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5

          Write-Host "Generirani latest.json:"
          Write-Host $latestJson

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          Set-Content -Path latest.json -Value $latestJson -Encoding UTF8
          git add latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update latest.json for $TAG"
            git push origin main
            Write-Host "latest.json posodobljen!"
          } else {
            Write-Host "Ni sprememb v latest.json"
          }

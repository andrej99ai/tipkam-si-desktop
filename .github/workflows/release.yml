name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Perfect Text ${{ github.ref_name }}'
          releaseBody: 'Nova različica Perfect Text. Prenesite datoteko Perfect.Text_x.x.x_x64-setup.exe spodaj.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Commit latest.json back to main
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Shrani vsebino latest.json, ki jo je ustvaril tauri-action
          $savedJson = Get-Content latest.json -Raw
          Write-Host "latest.json vsebina: $savedJson"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          # Obnovi tauri-action verzijo (git checkout main jo je prepisal)
          Set-Content -Path latest.json -Value $savedJson -NoNewline

          git add latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update latest.json for ${{ github.ref_name }}"
            git push origin main
            Write-Host "latest.json uspesno posodobljen"
          } else {
            Write-Host "Ni sprememb v latest.json"
          }

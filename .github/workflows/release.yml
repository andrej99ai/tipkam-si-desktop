name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set app version from tag
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $VERSION
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
          Write-Host "Version set to $VERSION"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Perfect Text ${{ github.ref_name }}'
          releaseBody: 'Nova razlicica Perfect Text.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Generate and commit latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG.TrimStart('v')

          Write-Host "=== latest.json po buildu ==="
          $currentJson = Get-Content "latest.json" -Raw
          Write-Host $currentJson

          $latestObj = $currentJson | ConvertFrom-Json
          if ($latestObj.version -eq $VERSION -and $latestObj.platforms.'windows-x86_64'.signature) {
            Write-Host "tauri-action generiral veljaven latest.json za $VERSION"
            $content = $currentJson
          } else {
            Write-Host "Iščem .sig datoteke..."
            Write-Host "=== Bundle mapa ==="
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

            $sigFiles = Get-ChildItem -Recurse "." -Filter "*.sig" -ErrorAction SilentlyContinue
            Write-Host "=== .sig datoteke: $($sigFiles.Count) ==="
            $sigFiles | ForEach-Object { Write-Host $_.FullName }

            $sigFile = $sigFiles | Where-Object { $_.Name -notlike "*msi*" } | Select-Object -First 1
            if (-not $sigFile) { $sigFile = $sigFiles | Select-Object -First 1 }

            if (-not $sigFile) {
              Write-Host "NAPAKA: Ni .sig datotek. Podpisovanje ni delalo."
              exit 1
            }

            $signature = (Get-Content $sigFile.FullName -Raw).Trim()
            $exeFile = Get-ChildItem -Recurse "src-tauri/target/release/bundle" -Filter "*setup.exe" | Select-Object -First 1
            $exeUrl = "https://github.com/andrej99ai/tipkam-si-desktop/releases/download/$TAG/$($exeFile.Name)"

            $content = [ordered]@{
              version  = $VERSION
              notes    = "Nova razlicica Perfect Text."
              pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  url       = $exeUrl
                  signature = $signature
                }
              }
            } | ConvertTo-Json -Depth 5
            Write-Host "latest.json generiran iz .sig datoteke"
          }

          Write-Host "=== Koncni latest.json ==="
          Write-Host $content

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          Set-Content -Path latest.json -Value $content -Encoding UTF8
          git add latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update latest.json for $TAG"
            git push origin main
            Write-Host "USPEH: latest.json posodobljen!"
          } else {
            Write-Host "Ni sprememb"
          }

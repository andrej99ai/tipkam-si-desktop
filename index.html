<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Text</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- ====== LOGIN SCREEN ====== -->
      <div id="login-screen" class="login-screen">
        <div class="login-card">
          <div class="brand">
            <div class="brand-icon">PT</div>
            <h1>Perfect Text</h1>
            <p>AI Speech-to-Text</p>
          </div>

          <div class="login-separator">Nadaljuj z e-pošto</div>

          <div class="form-group">
            <label for="email">E-pošta</label>
            <input type="email" id="email" placeholder="vas@email.com" autocomplete="email" spellcheck="false" />
          </div>
          <div class="form-group">
            <label for="password">Geslo</label>
            <input type="password" id="password" placeholder="Vaše geslo" autocomplete="current-password" />
          </div>
          <button id="login-btn" class="btn-primary">Prijava</button>
          <p id="login-error" class="error-msg"></p>
        </div>
      </div>

      <!-- ====== MAIN SCREEN ====== -->
      <div id="main-screen" class="main-screen">
        <div class="main-header">
          <div class="main-header-left">
            <div class="header-logo">PT</div>
            <div>
              <h2>Perfect Text</h2>
              <span class="user-info" id="user-email"></span>
            </div>
          </div>
          <button id="logout-btn" class="btn-logout">Odjava</button>
        </div>

        <div class="status-area">
          <!-- LANGUAGE SELECT -->
          <div class="setting-row">
            <label class="setting-label" for="language-select">Jezik govora</label>
            <select id="language-select" class="setting-select">
              <!-- Populated by JS -->
            </select>
          </div>

          <!-- MODE TOGGLE (only visible for Slovenian) -->
          <div id="mode-toggle" class="mode-toggle-section">
            <span class="mode-toggle-label">Način prepisa</span>
            <div class="mode-toggle">
              <button id="mode-accurate-btn" class="mode-btn active" title="Natančno oblikovano besedilo (Gemini Pro)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <circle cx="12" cy="12" r="6"/>
                  <circle cx="12" cy="12" r="2"/>
                </svg>
                Natančno
              </button>
              <button id="mode-fast-btn" class="mode-btn" title="Hiter surov prepis govora (Gemini Flash)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                Hitro
              </button>
            </div>
          </div>

          <!-- STATUS -->
          <div class="status-indicator">
            <div id="status-dot" class="status-dot ready"></div>
            <p id="status-text" class="status-text">Pripravljen — pritisni F2 za narekovanje</p>
          </div>

          <div class="shortcut-hint">
            <kbd class="key" id="shortcut-key">F2</kbd>
            <span>za začetek / ustavitev narekovanja</span>
          </div>

          <!-- LAST TRANSCRIPT -->
          <div id="last-transcript" class="last-transcript" style="display:none">
            <label>ZADNJI TRANSKRIPT:</label>
            <p id="last-transcript-text"></p>
          </div>
        </div>

        <!-- SETTINGS -->
        <div class="settings-panel">
          <div class="setting-row">
            <label class="setting-label" for="shortcut-select">Bližnjica</label>
            <select id="shortcut-select" class="setting-select setting-select-small">
              <option value="F2">F2</option>
              <option value="F3">F3</option>
              <option value="F4">F4</option>
              <option value="F5">F5</option>
              <option value="F6">F6</option>
              <option value="F7">F7</option>
              <option value="F8">F8</option>
              <option value="F9">F9</option>
              <option value="Ctrl+Shift+R">Ctrl+Shift+R</option>
              <option value="Ctrl+Shift+D">Ctrl+Shift+D</option>
              <option value="Ctrl+Shift+T">Ctrl+Shift+T</option>
            </select>
          </div>
        </div>

        <div class="main-footer">
          <button id="minimize-btn" class="btn-minimize">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path d="M19 11H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Minimiziraj v tray
          </button>
          <p class="footer-hint">Aplikacija bo delovala v ozadju. Pritisni bližnjico kadarkoli.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
